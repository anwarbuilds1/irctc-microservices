services:
  user-service:
    build:
      context: ./services/user-service
      dockerfile: Dockerfile.dev

    container_name: user-service

    ports:
      - "3000:3000"

    env_file:
      - ./services/user-service/.env

    volumes:
      - ./services/user-service:/app
      - /app/node_modules

    command: npm run dev
